<form [formGroup]="autoBuilderControlsForm" class=" mb-3">
  <div  class="form-group row mb-3">
    <button class="btn btn-primary" type="button" (click)="singleStepBuild()">Build Single Step</button>
  </div>
  <div class="form-group row">
    <label for="autoBuilderControlsCount">Number of bricks</label>
    <input type="number" class="form-control" id="autoBuilderControlsCount" ngDefaultControl formControlName="autoBuilderControlsCount" min="2"
           [value]="autoBuilderControlsDefaults.autoBuilderControlsCount">
  </div>
  <div class="form-group row">
    <label for="autoBuilderControlsInterval">Build interval</label>
    <input type="number" class="form-control" id="autoBuilderControlsInterval" ngDefaultControl formControlName="autoBuilderControlsInterval" min="100" step="100"
           [value]="autoBuilderControlsDefaults.autoBuilderControlsInterval">
  </div>
  <div class="input-group row">
    <button class="btn btn-primary" type="button" (click)="autoBuild()" [disabled]="!autoBuilderControlsForm.valid || autoBuildProgress > 0">Auto Build</button>
    <button class="btn btn-outline-primary" type="button" (click)="cancelAutoBuild()" *ngIf="autoBuildProgress > 0">Cancel</button>
  </div>
</form>
