image: node:latest

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

stages:
  - test
  - build
  - deploy

test:unit:
  stage: test
  before_script:
    - apt-get update && apt-get install -y unzip fontconfig locales gconf-service libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 libnss3 lsb-release xdg-utils wget
    - npm install --silent
  script: node_modules/.bin/ng test --no-watch
  artifacts:
    paths:
      - coverage/

test:e2e:
  stage: test
  before_script:
    - apt-get update && apt-get install -y unzip fontconfig locales gconf-service libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 libnss3 lsb-release xdg-utils wget
    - npm install --silent
  script: node_modules/.bin/ng e2e

build:release:
  stage: build
  script: node_modules/.bin/ng build --prod --aot
  artifacts:
    name: "project-$CI_COMMIT_REF_NAME"
    paths:
      - dist/
  only:
    - tags

deploy:production:
  stage: deploy
  environment:
    name: production
    url: https://randego.appspot.com
  before_script:
    - wget https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-sdk-286.0.0-linux-x86_64.tar.gz
    - tar -xzf  google-cloud-sdk-286.0.0-linux-x86_64.tar.gz
    - ./google-cloud-sdk/install.sh
  dependencies:
    - build:release
  script:
    - ./google-cloud-sdk/bin/gcloud auth activate-service-account --key-file $GAE_KEY_FILE
    - ./google-cloud-sdk/bin/gcloud meta list-files-for-upload
    - ./google-cloud-sdk/bin/gcloud app deploy --project=$GAE_PROJECT_ID --verbosity=debug
  only:
    - tags

pages:
  stage: deploy
  dependencies:
    - test:unit
  script:
    - mv coverage/ public/
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - master
